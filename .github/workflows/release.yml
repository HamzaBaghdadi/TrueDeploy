# Builds TrueDeploy for Windows and publishes a GitHub Release when a version
# tag is pushed:
#
#   1. Bump the version in services/app.go, build/config.yml and
#      build/windows/info.json (a test fails if they disagree).
#   2. git tag v0.2.0 && git push origin v0.2.0
#
# The release gets the installer and the bare .exe. Running apps find it
# through the in-app update check (GitHub's "latest release").
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' services/app.go)
          if [ "$TAG" != "$CODE" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match services.Version ($CODE). Bump the version, then tag again."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Install Wails and NSIS
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          choco install nsis --no-progress -y
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"

      - name: Test
        run: go test ./... -count=1

      - name: Build installer
        run: wails3 package

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INSTALLER=$(ls bin/*-installer.exe)
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$INSTALLER" bin/truedeploy.exe \
            --title "TrueDeploy ${GITHUB_REF_NAME#v}" --generate-notes $PRERELEASE
